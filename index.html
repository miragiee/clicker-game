<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Лучший кликер в мире</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<main>
			<h1>Лучший кликер в мире</h1>

			<div class="guide">
				Кликайте на кнопку, чтобы получить <strong>ОЧКИ</strong>. <br />
				Улучшайте <strong>СИЛУ НАЖАТИЯ</strong>, чтобы получить больше
				<strong>ОЧКОВ</strong> за клик. Улучшайте
				<strong>АВТОКЛИК</strong> чтобы меньше играть =&#41;
			</div>

			<div class="alert">Кликай!</div>

			<button class="clicker-btn">НАЖМИ МЕНЯ</button>

			<div class="upgrade">
				<button class="upgrade-strength">УЛУЧШИТЬ СИЛУ: 10</button>
				<button class="upgrade-autoclicker">УЛУЧШИТЬ АВТОКЛИК: 20</button>
			</div>

			<div class="stats">
				<div class="totalScore"><strong>Общий счёт:</strong> 0</div>
				<div class="maxScore"><strong>Максимальный счёт:</strong> 0</div>
				<div class="totalClicks"><strong>Всего кликов:</strong> 0</div>
				<div class="totalUpgrades"><strong>Всего улучшений:</strong> 0</div>
			</div>

			<script src="app.js"></script>
		</main>
	</body>
</html>
